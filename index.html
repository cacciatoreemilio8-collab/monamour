<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b0a1f">
<title>Una piccola sorpresa 💌</title>
<style>
:root{--perla:#fffaf8;--cipria:#f4d9de;--rosa:#ff4f84;--cil:#c3123f;--bord:#3b0a1f;--soft:#f6bfce;--tx:#fff5f4;--tx2:#ffd3df;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--serif);color:var(--tx);overflow:hidden;background:var(--bord);touch-action:manipulation;-webkit-text-size-adjust:100%;transition:color 1.2s}
body.light{--tx:#5a0f2c;--tx2:#a8325a}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity 1.6s ease}
#bgD{background:radial-gradient(90% 60% at 50% 38%,rgba(255,110,160,.38),transparent 70%),linear-gradient(170deg,#8a1f4b 0%,#521031 45%,#2a0716 100%)}
#bgL{opacity:0;background:radial-gradient(80% 55% at 50% 30%,#fff 0%,rgba(255,255,255,0) 70%),linear-gradient(175deg,#fff2f5 0%,#ffd3e0 55%,#ff9fbd 100%)}
#bgF{opacity:0;background:radial-gradient(40% 30% at 15% 20%,rgba(255,255,255,.9),transparent 70%),radial-gradient(45% 35% at 88% 70%,rgba(255,120,165,.55),transparent 70%),radial-gradient(50% 40% at 30% 95%,rgba(255,200,120,.35),transparent 70%)}
body.light #bgL{opacity:1}body.final #bgF{opacity:1}
.bk{position:fixed;z-index:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,150,190,.3),transparent 68%);animation:drift 16s ease-in-out infinite alternate;transition:opacity 1.5s}
.bk:nth-of-type(1){width:60vmax;height:60vmax;left:-25vmax;top:-20vmax}
.bk:nth-of-type(2){width:46vmax;height:46vmax;right:-20vmax;top:30vh;animation-delay:-5s}
.bk:nth-of-type(3){width:38vmax;height:38vmax;left:-10vmax;bottom:-16vmax;animation-delay:-9s}
body.final .bk{opacity:1.6}
@keyframes drift{to{transform:translate(4vmax,-3vmax) scale(1.08)}}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(circle at 50% 42%,#fff 0%,rgba(255,205,222,.9) 40%,transparent 78%)}
#flash.on{opacity:1}

.screen{position:fixed;inset:0;z-index:1;display:flex;overflow:hidden auto;-webkit-overflow-scrolling:touch;padding:max(24px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;text-align:center}
.screen.on{opacity:1;visibility:visible}
.wrap{margin:auto;width:100%;max-width:520px;position:relative}
.screen.on .wrap{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
#s2.on .wrap{animation-name:zoom}#s3.on .wrap{animation-name:slide}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.st::before{content:"N";position:fixed;z-index:-1;font:italic 500 62vmax/1 var(--serif);color:#fff;opacity:.05;pointer-events:none;left:50%;top:50%;transform:translate(-50%,-50%)}
#s2::before{transform:translate(-30%,-55%) rotate(-8deg)}#s3::before{transform:translate(-70%,-45%) rotate(8deg)}

/* cuore 3D */
.hw{position:relative;margin:0 auto;isolation:isolate;transition:transform 1.1s cubic-bezier(.2,1.2,.4,1)}
.hw::before{content:"";position:absolute;inset:-38%;z-index:-1;background:radial-gradient(circle,rgba(255,90,140,.6),rgba(255,90,140,0) 62%);animation:halo 3.4s ease-in-out infinite;transition:opacity 1s}
.hw.big{width:clamp(150px,46vw,210px);height:clamp(150px,46vw,210px)}
.hw.mid{width:clamp(96px,28vw,132px);height:clamp(96px,28vw,132px)}
.hw.sm{width:60px;height:60px}.hw.sm .sp{display:none}
.tl{width:100%;height:100%;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}
.heart{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 24px rgba(120,10,50,.45));animation:beat 1.7s ease-in-out infinite;transition:filter 1s}
.hw.lit{transform:scale(1.32)}
.hw.lit .heart{filter:drop-shadow(0 0 30px #ff7aa5) brightness(1.18)}
.hw.lit::before{inset:-60%}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.1)}28%{transform:scale(1)}42%{transform:scale(1.06)}70%{transform:scale(1)}}
@keyframes halo{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}
.sp{position:absolute;font-style:normal;font-size:14px;color:#ffe9a8;text-shadow:0 0 8px #ffd36e,0 0 16px rgba(255,255,255,.8);animation:tw 2.6s ease-in-out infinite;animation-delay:var(--d);pointer-events:none}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
#sf.on .hw{animation:pop 1.3s .25s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}

/* testi */
.line{font-style:italic;font-weight:500;line-height:1.3;margin:0;text-wrap:balance;color:var(--tx);text-shadow:0 2px 24px rgba(40,5,20,.25)}
body.light .line{text-shadow:0 2px 18px rgba(255,255,255,.7)}
.intro{font-size:clamp(1.75rem,7.8vw,2.6rem);margin:28px 0 34px;min-height:2.7em;display:flex;align-items:center;justify-content:center}
.caret::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:3px;background:var(--rosa);animation:blink .8s steps(1) infinite;vertical-align:-.12em}
@keyframes blink{50%{opacity:0}}
.story{font-size:clamp(1.5rem,6.6vw,2.2rem);max-width:20em;margin:0 auto 38px;line-height:1.38}
.q{font-size:clamp(1.9rem,8.6vw,2.95rem);margin:26px 0 30px;line-height:1.22;color:var(--cil);font-weight:600}
.w{display:inline-block}
.screen.on [data-v="1"] .w{animation:wv1 .95s var(--d) both ease-out}
.screen.on [data-v="2"] .w{animation:wv2 .9s var(--d) both cubic-bezier(.2,1.3,.4,1)}
.screen.on [data-v="3"] .w{animation:wv3 .9s var(--d) both ease-out}
@keyframes wv1{from{opacity:0;transform:translateY(14px);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}
@keyframes wv2{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes wv3{from{opacity:0;transform:translateX(-18px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}

/* pulsanti */
.btn{font:inherit;font-family:var(--sans);border:0;cursor:pointer;border-radius:999px;user-select:none;-webkit-user-select:none;transition:transform .25s ease,box-shadow .35s ease,opacity .9s ease,background .3s}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px var(--cil)}
.btn:active{transform:scale(.95)}
.go{position:relative;overflow:hidden;font-size:1.08rem;font-weight:600;letter-spacing:.01em;padding:1em 1.9em;color:#fff;background:linear-gradient(135deg,#ff8fb1,var(--rosa) 55%,var(--cil));box-shadow:0 10px 30px rgba(255,79,132,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%)}
.next{font-size:1.05rem;font-weight:500;padding:.9em 2em;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(40,5,20,.3)}
@media (hover:hover){.go:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(255,79,132,.65),inset 0 1px 0 rgba(255,255,255,.5)}.go:hover::after{transform:translateX(120%);transition:transform .8s}.next:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}.no:hover{transform:translateY(-2px)}}
.late{opacity:0;pointer-events:none;transform:translateY(8px)}
.late.show{opacity:1;pointer-events:auto;transform:none}
.row{display:flex;flex-direction:column;align-items:center;gap:20px;transition:opacity .6s ease}
.yes{--s:1;font-size:calc(1.15rem*var(--s));padding:.8em 1.6em;max-width:100%;white-space:nowrap;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9bbb,#ff4f84 55%,var(--cil));box-shadow:0 12px 34px rgba(255,60,115,.5),inset 0 1px 0 rgba(255,255,255,.5);animation:glow 2.4s ease-in-out infinite;transition:font-size .5s cubic-bezier(.34,1.56,.64,1),transform .2s}
@keyframes glow{0%,100%{box-shadow:0 12px 34px rgba(255,60,115,.5),0 0 0 0 rgba(255,79,132,.4),inset 0 1px 0 rgba(255,255,255,.5)}50%{box-shadow:0 12px 40px rgba(255,60,115,.7),0 0 0 14px rgba(255,79,132,0),inset 0 1px 0 rgba(255,255,255,.5)}}
.no{font-size:1.02rem;padding:.8em 1.5em;color:#9c2f55;background:rgba(255,255,255,.85);border:1.5px solid var(--soft);box-shadow:0 6px 18px rgba(195,18,63,.14);transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .6s}
.hint{font-family:var(--sans);min-height:2.8em;margin:20px 0 0;font-size:1rem;color:var(--tx2);transition:opacity .5s}
.gone{opacity:0!important;pointer-events:none!important}

.msg{max-width:460px;margin:22px auto 0}
.msg p{margin:.95em 0;font-size:clamp(1.08rem,4.4vw,1.28rem);line-height:1.6;color:var(--tx);opacity:0;transform:translateY(12px);filter:blur(5px);transition:opacity 1.1s ease,transform 1.1s ease,filter 1.1s ease}
.msg p.h{font-size:clamp(1.75rem,8.4vw,2.7rem);font-style:italic;font-weight:600;line-height:1.15;color:var(--cil)}
.msg p.in{opacity:1;transform:none;filter:none}
.end{opacity:0;transition:opacity 1.4s;margin:14px 0 8px}.end.on{opacity:1}
.end p{font-size:clamp(1.2rem,5.2vw,1.55rem);font-style:italic;color:var(--cil);margin:16px 0 0}
#music{position:fixed;z-index:60;top:max(12px,env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;font-size:1.15rem;line-height:1;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.light #music{background:rgba(255,255,255,.85);border-color:var(--soft);box-shadow:0 4px 14px rgba(195,18,63,.15)}
.sr{position:absolute;width:0;height:0;overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}.screen{transition:opacity .2s}.msg p{opacity:1;transform:none;filter:none}}
</style>
</head>
<body>
<svg class="sr" aria-hidden="true" focusable="false"><defs>
<radialGradient id="g1" cx=".35" cy=".28" r=".9"><stop offset="0" stop-color="#ffc2d4"/><stop offset=".4" stop-color="#ff4f84"/><stop offset="1" stop-color="#b80f3c"/></radialGradient>
<linearGradient id="g2" x1=".2" y1=".1" x2=".8" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".6" stop-color="#7a0a2c" stop-opacity="0"/><stop offset="1" stop-color="#5a0620" stop-opacity=".55"/></linearGradient>
<path id="hp" d="M50 90C10 60 2 32 22 16c13-10 26-3 28 9 2-12 15-19 28-9 20 16 12 44-28 74z"/>
<symbol id="hrt" viewBox="0 0 100 100"><use href="#hp" fill="url(#g1)"/><use href="#hp" fill="url(#g2)"/>
<path d="M23 27c3-7 11-9 16-4" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3.2" stroke-linecap="round"/>
<ellipse cx="30" cy="34" rx="5" ry="3" fill="#fff" fill-opacity=".35" transform="rotate(-35 30 34)"/>
<use href="#hp" fill="none" stroke="#ffd0de" stroke-opacity=".45" stroke-width="1"/>
<text x="50" y="58" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="36" fill="#fff" stroke="#7a0a2c" stroke-opacity=".35" stroke-width=".7" paint-order="stroke">N</text></symbol></defs></svg>

<div id="bgD" class="bg"></div><div id="bgL" class="bg"></div><div id="bgF" class="bg"></div>
<i class="bk"></i><i class="bk"></i><i class="bk"></i>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="flash"></div>
<button id="music" class="btn" type="button" aria-pressed="false" aria-label="Attiva la musica">🎵</button>

<main>
<section id="s0" class="screen on"><div class="wrap">
  <div id="h0" class="hw big" data-h></div>
  <h1 id="t0" class="line intro" aria-label="C’è una piccola sorpresa per te 🥹❤️"></h1>
  <button id="open" class="btn go late" type="button">Apri la sorpresa 💌</button>
</div></section>

<section id="s1" class="screen st"><div class="wrap">
  <p class="line story" data-v="1">Sai che volevo prepararti una cosa carina per te? ❤️</p>
  <button class="btn next late" type="button" data-next="s2">Continua ❤️</button>
</div></section>

<section id="s2" class="screen st"><div class="wrap">
  <p class="line story" data-v="2">Comunque volevo solo dirti che mi fa davvero piacere passare del tempo con te e che riesci sempre a farmi sorridere 🥹❤️</p>
  <button class="btn next late" type="button" data-next="s3">Continua ❤️</button>
</div></section>

<section id="s3" class="screen st"><div class="wrap">
  <p class="line story" data-v="3">Volevo semplicemente regalarti un sorriso oggi 💗</p>
  <button id="reveal" class="btn go late" type="button">Apri 💌</button>
</div></section>

<section id="sf" class="screen"><div class="wrap">
  <div id="hf" class="hw big" data-h></div>
  <div id="msg" class="msg" aria-live="polite"></div>
  <div id="end" class="end"><div class="hw sm" data-h></div><p>Fatto con un pizzico di dolcezza ❤️</p></div>
</div></section>
</main>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)},$$=function(s){return document.querySelectorAll(s)};
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

/* ---------- Cuori 3D con bagliori ---------- */
var spk=[[2,14,0],[88,8,.6],[96,52,1.2],[6,66,1.8],[78,90,.9],[22,92,.3]];
$$("[data-h]").forEach(function(el){
  el.innerHTML='<div class="tl">'+spk.map(function(s){return'<i class="sp" style="left:'+s[0]+'%;top:'+s[1]+'%;--d:'+s[2]+'s">✦</i>'}).join("")+'<svg class="heart" aria-hidden="true"><use href="#hrt"/></svg></div>';
});
addEventListener("pointermove",function(e){
  if(e.pointerType!=="mouse"||reduce)return;
  var st=document.documentElement.style;
  st.setProperty("--ry",((e.clientX/innerWidth-.5)*16).toFixed(1)+"deg");
  st.setProperty("--rx",(-(e.clientY/innerHeight-.5)*16).toFixed(1)+"deg");
});

/* ---------- Canvas: particelle, stelle, cuori, coriandoli ---------- */
var cv=$("#bg"),cx=cv.getContext("2d"),W=0,H=0,D=1;
var cD=["#ffb3c8","#ff8fb1","#ff5c8a","#ffd6e2","#e8546e"],cL=["#ff8fb1","#ff5c8a","#e8546e","#c3123f","#ffb3c8"];
var confC=["#ff8fb1","#ff5c8a","#e8546e","#c3123f","#fff","#ffd36e","#ffc2d4"];
var hearts=[],parts=[],stars=[],dots=[],boost=1,amb=0,light=false,tick=0;
function size(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}
size();addEventListener("resize",size);
var i;
for(i=0;i<(reduce?12:34);i++)stars.push({x:Math.random(),y:Math.random(),r:rnd(1.4,3.4),p:rnd(0,6.28),v:rnd(.5,1.6)});
for(i=0;i<(reduce?8:28);i++)dots.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1.2,3.6),vx:rnd(-.12,.12),vy:rnd(-.25,-.05),p:rnd(0,6.28),v:rnd(.4,1.2)});
function heartPath(s){cx.beginPath();cx.moveTo(0,.9*s);cx.bezierCurveTo(-1.1*s,.1*s,-.9*s,-.9*s,0,-.4*s);cx.bezierCurveTo(.9*s,-.9*s,1.1*s,.1*s,0,.9*s);cx.closePath()}
function sparkle(x,y,r,a,c){
  cx.save();cx.translate(x,y);cx.globalAlpha=a;cx.fillStyle=c||"#ffd98a";
  cx.beginPath();cx.moveTo(0,-r*2);cx.quadraticCurveTo(0,0,r*2,0);cx.quadraticCurveTo(0,0,0,r*2);cx.quadraticCurveTo(0,0,-r*2,0);cx.quadraticCurveTo(0,0,0,-r*2);cx.fill();
  cx.globalAlpha=a*.3;cx.beginPath();cx.arc(0,0,r*1.7,0,6.28);cx.fill();cx.restore();
}
function spawn(){amb++;var s=rnd(5,16);hearts.push({x:rnd(0,W),y:H+30,s:s,vy:.15+s*.035,ph:rnd(0,6.28),sw:rnd(.3,.9),a:.2+s*.028,c:pick(light?cL:cD),r:rnd(-.3,.3)})}
function add(p){if(parts.length<340)parts.push(p)}
function burst(x,y,n,spread){
  n=reduce?Math.ceil(n/3):n;
  for(var i=0;i<n;i++){var an=rnd(0,6.28),sp=rnd(2,spread||9),t=Math.random();
    add({x:x,y:y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-2,g:.12,s:t<.5?rnd(5,11):t<.75?rnd(3,6):rnd(4,8),t:t<.5?0:t<.75?1:2,c:pick(confC),rot:rnd(0,6.28),vr:rnd(-.2,.2),life:0,max:rnd(70,130)})}
}
function floatHearts(x,y,n){
  n=reduce?2:n;
  for(var i=0;i<n;i++)add({x:x+rnd(-18,18),y:y,vx:rnd(-.9,.9),vy:-rnd(1.4,3),g:-.01,s:rnd(4,9),t:0,c:pick(["#ff5c8a","#e8546e","#ff8fb1","#c3123f"]),rot:rnd(-.4,.4),vr:rnd(-.05,.05),life:0,max:rnd(55,90)});
}
function rain(n){
  n=reduce?Math.ceil(n/3):n;
  for(var i=0;i<n;i++)add({x:rnd(0,W),y:rnd(-60,-5),vx:rnd(-1,1),vy:rnd(2,4.5),g:.02,s:rnd(4,8),t:Math.random()<.7?2:0,c:pick(confC),rot:rnd(0,6.28),vr:rnd(-.18,.18),life:0,max:rnd(120,200)});
}
function attract(x,y){
  if(reduce)return;
  for(var i=0;i<40;i++){var a=rnd(0,6.28),d=rnd(Math.max(W,H)*.35,Math.max(W,H)*.7);
    add({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,tx:x+rnd(-10,10),ty:y+rnd(-10,10),vx:0,vy:0,g:0,s:rnd(2,4.5),t:Math.random()<.4?1:3,c:"#ffe3ec",rot:0,vr:0,life:0,max:rnd(50,75)})}
}
function frame(){
  tick++;var t=tick/60;cx.clearRect(0,0,W,H);
  dots.forEach(function(d){
    d.x+=d.vx;d.y+=d.vy;if(d.y<-10){d.y=H+10;d.x=rnd(0,W)}if(d.x<-10)d.x=W+10;if(d.x>W+10)d.x=-10;
    var a=.25+.55*Math.abs(Math.sin(t*d.v+d.p)),c=light?"#ff8fb1":"#ffd9e5";
    cx.fillStyle=c;cx.globalAlpha=a*.16;cx.beginPath();cx.arc(d.x,d.y,d.r*3.2,0,6.28);cx.fill();
    cx.globalAlpha=a;cx.beginPath();cx.arc(d.x,d.y,d.r,0,6.28);cx.fill();
  });
  stars.forEach(function(s){sparkle(s.x*W,s.y*H,s.r,.2+.6*Math.abs(Math.sin(t*s.v+s.p)),light?"#ffcf70":"#fff1c4")});
  var target=Math.round((W<600?12:22)*boost*(reduce?.4:1));
  if(amb<target&&Math.random()<.12)spawn();
  for(var i=hearts.length-1;i>=0;i--){
    var h=hearts[i];h.y-=h.vy*(boost>1?1.8:1);h.x+=Math.sin(t*h.sw+h.ph)*.4;
    if(h.y<-30){hearts.splice(i,1);amb--;continue}
    cx.save();cx.translate(h.x,h.y);cx.rotate(h.r+Math.sin(t+h.ph)*.15);cx.globalAlpha=h.a;cx.fillStyle=h.c;heartPath(h.s);cx.fill();cx.restore();
  }
  for(var j=parts.length-1;j>=0;j--){
    var p=parts[j];p.life++;
    if(p.tx!==undefined){p.x+=(p.tx-p.x)*.075;p.y+=(p.ty-p.y)*.075}
    else{p.vy+=p.g;p.vx*=.992;p.x+=p.vx;p.y+=p.vy}
    p.rot+=p.vr;
    if(p.life>p.max||p.y>H+30||p.y<-80){parts.splice(j,1);continue}
    var al=Math.min(1,(p.max-p.life)/30);
    if(p.t===1){sparkle(p.x,p.y,p.s*.6,al,p.c);continue}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=al;cx.fillStyle=p.c;
    if(p.t===0){heartPath(p.s);cx.fill()}
    else if(p.t===3){cx.beginPath();cx.arc(0,0,p.s,0,6.28);cx.fill();cx.globalAlpha=al*.25;cx.beginPath();cx.arc(0,0,p.s*3,0,6.28);cx.fill()}
    else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    cx.restore();
  }
  cx.globalAlpha=1;requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Musica (WebAudio, facoltativa, nessun file esterno) ---------- */
var ac=null,master=null,timer=null,step=0,on=false,mb=$("#music");
var prog=[[261.63,329.63,392,493.88],[220,261.63,329.63,392],[174.61,220,261.63,329.63],[196,246.94,293.66,349.23]];
var pat=[0,1,2,3,2,3,1,2];
function note(f,t,d,v,type){
  var o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
function play(){
  var t=ac.currentTime+.05,bar=Math.floor(step/8)%4,c=prog[bar],i=step%8;
  note(c[pat[i]]*2,t,1.1,.5,"sine");
  if(i===0){note(c[0]/2,t,3.4,.55,"triangle");note(c[1],t,3.4,.12,"sine");note(c[2],t,3.4,.14,"sine");note(c[3],t,3.4,.1,"sine")}
  if(i===4)note(c[1],t,1.6,.14,"sine");
  step++;
}
function startSynth(){
  try{
    if(!ac){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();master=ac.createGain();master.gain.value=.13;master.connect(ac.destination)}
    if(ac.resume)ac.resume();if(!timer)timer=setInterval(play,420);
  }catch(e){}
}
function stopSynth(){if(timer){clearInterval(timer);timer=null}if(ac&&ac.suspend)ac.suspend()}
mb.addEventListener("click",function(){
  on=!on;mb.setAttribute("aria-pressed",String(on));mb.textContent=on?"🎶":"🎵";
  mb.setAttribute("aria-label",on?"Disattiva la musica":"Attiva la musica");
  if(on)startSynth();else stopSynth();
});
document.addEventListener("visibilitychange",function(){if(document.hidden)stopSynth();else if(on)startSynth()});
})();
</script>
